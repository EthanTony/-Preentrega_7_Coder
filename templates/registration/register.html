{% extends "base.html" %}

{% block title %}Crear cuenta · Blog Django{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4 p-lg-5">
                <h1 class="h3 mb-2">Crear cuenta</h1>
                <p class="text-secondary mb-4">
                    Regístrate para publicar ideas y gestionar tus propias publicaciones.
                </p>

                <form method="post" novalidate>
                    {% csrf_token %}
                    {% include "partials/form_fields.html" %}

                    <button type="submit" class="btn btn-primary w-100 mt-2">Crear cuenta</button>
                </form>

                <hr class="my-4">
                <p class="text-center text-secondary mb-0">
                    ¿Ya tienes cuenta? <a href="{% url 'login' %}">Inicia sesión</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
